# Publica em produção (https://pokemon-matchups.web.app) a cada push na main.
# O segredo FIREBASE_SERVICE_ACCOUNT_POKEMON_MATCHUPS é criado pelo comando
# `firebase init hosting:github` (ver README).

name: Deploy to Firebase Hosting on merge
on:
  push:
    branches:
      - main
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci && npm run build
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_POKEMON_MATCHUPS }}
          channelId: live
          projectId: pokemon-matchups
